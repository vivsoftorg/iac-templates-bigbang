neuvector:
  # -- Toggle deployment of Neuvector.
  enabled: true
  # -- Choose source type of "git" or "helmRepo"
  sourceType: "helmRepo"
  git:
    repo: https://repo1.dso.mil/big-bang/product/packages/neuvector.git
    path: "./chart"
    tag: "2.8.11-bb.0"
  helmRepo:
    repoName: "registry1"
    chartName: "neuvector"
    tag: "2.8.11-bb.0"
  # -- Redirect the package ingress to a specific Istio Gateway (listed in `istio.gateways`).  The default is "public".
  ingress:
    gateway: ""
  sso:
    # -- Toggle SSO for Neuvector on and off
    enabled: false
    # -- OIDC Client ID to use for Neuvector
    client_id: ""
    # -- OIDC Client Secret to use for Neuvector
    client_secret: ""
    # -- Default role to use for Neuvector OIDC users. Supports admin, reader, or no default
    default_role: ""
    # -- Default role to use for Neuvector OIDC users. Supports admin, reader, or no default
    group_claim: ""
    # -- Default role to use for Neuvector OIDC users. Supports admin, reader, or no default
    group_mapped_roles: []
  # -- Flux reconciliation overrides specifically for the Neuvector Package
  flux:
    driftDetection:
      ignore:
        - paths: [""]
          target:
            kind: CronJob
        - paths: [""]
          target:
            kind: Lease
        - paths: [""]
          target:
            kind: Secret
        - paths: [""]
          target:
            kind: Job
        - paths: [""]
          target:
            kind: StatefulSet
  # -- Values to passthrough to the Neuvector chart: https://repo1.dso.mil/big-bang/product/packages/neuvector.git
  values:
    upstream:
      controller:
        replicas: 1
        podLabels:
          app.kubernetes.io/name: neuvector-controller-pod
        podAnnotations:
          sidecar.istio.io/inject: "false"
        certupgrader:
          podLabels:
            app.kubernetes.io/name: neuvector-cert-upgrader-job
          podAnnotations:
            sidecar.istio.io/inject: "false"
      manager:
        podLabels:
          app.kubernetes.io/name: neuvector-manager-pod
        podAnnotations:
          sidecar.istio.io/inject: "false"
      enforcer:
        nodeSelector:
          kubernetes.io/hostname: aks-nodepool-15461813-vmss000004
        podLabels:
          app.kubernetes.io/name: neuvector-enforcer-pod
        podAnnotations:
          sidecar.istio.io/inject: "false"
      cve:
        scanner:
          replicas: 1
          podLabels:
            app.kubernetes.io/name: neuvector-scanner-pod
          podAnnotations:
            sidecar.istio.io/inject: "false"
    monitor:
      exporter:
        podLabels:
          app.kubernetes.io/name: neuvector-prometheus-exporter-pod
        podAnnotations:
          sidecar.istio.io/inject: "false"
  # -- Post Renderers.  See docs/postrenders.md
  postRenderers: []
